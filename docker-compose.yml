services:
  mongo:
    image: mongo:7
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/replate
      NODE_ENV: development
    ports:
      - '127.0.0.1:5000:5000'
    depends_on:
      mongo:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '127.0.0.1:5173:8080'
    depends_on:
      - api
volumes:
  mongo-data:
